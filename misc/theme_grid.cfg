# Grid view of the built-in <OPL> theme: the Coverflow look with the covers in rows and columns
# (multi-view themes, idea by KrahJohlito). Pages of 4 x 2 covers, 6 x 2 on a 16:9 picture (covers draw at
# 3/4 width there), as RIPPS2's RIPGRID lays them out (akilluminati47). Device sidebar is hidden; navigation
# remains available, and a game with no cover shows its serial on a glass tile.
# No global colour keys: see thmLoad() in src/themes.c (#574).
